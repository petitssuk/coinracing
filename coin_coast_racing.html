<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>코인 코스트 레이싱 - 멀티플레이</title>
  <style>
    :root {
      --bg-sky: #e8f5ff;
      --bg-sand: #fff7e0;
      --card-bg: #ffffff;
      --primary: #1976d2;
      --primary-dark: #0d47a1;
      --accent: #ff8f00;
      --accent-soft: #fff3cd;
      --text-main: #1b2a3a;
      --text-sub: #5c6f82;
      --border: #dce8f3;
      --success: #2e7d32;
    }

    * {
      box-sizing: border-box;
      user-select: none;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
      background: linear-gradient(180deg, #dff1ff 0%, #f5fbff 45%, #fff5d6 100%);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    .app-shell {
      width: 100%;
      max-width: 780px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 24px;
      box-shadow: 0 14px 36px rgba(15, 52, 96, 0.1);
      overflow: hidden;
    }

    .header {
      padding: 22px 24px 16px;
      text-align: center;
      background: linear-gradient(135deg, #e3f2fd 0%, #fffde7 100%);
      border-bottom: 1px solid var(--border);
    }

    .badge-top {
      display: inline-block;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.08em;
      color: var(--primary-dark);
      background: #ffffff;
      border: 1px solid #bbdefb;
      padding: 4px 10px;
      border-radius: 999px;
      margin-bottom: 8px;
    }

    .title {
      margin: 0;
      font-size: 28px;
      font-weight: 900;
      color: #0b57d0;
    }

    .subtitle {
      margin: 6px 0 0;
      font-size: 14px;
      color: var(--text-sub);
    }

    .content {
      padding: 20px 24px 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .panel {
      background: #f9fcff;
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 16px 18px;
    }

    .hof-panel {
      background: #fffdf4;
      border: 1px solid #ffe58f;
      border-radius: 18px;
      padding: 14px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .hof-title {
      font-weight: 800;
      font-size: 15px;
      color: #8d5b00;
    }

    .hof-sub {
      font-size: 13px;
      color: #7a6845;
      margin-top: 3px;
    }

    .my-best-pill {
      background: #ffeaa7;
      color: #6d4c00;
      font-weight: 800;
      font-size: 13px;
      padding: 6px 12px;
      border-radius: 999px;
    }

    .lobby-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .lobby-status {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 800;
      font-size: 16px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #2ecc71;
      display: inline-block;
    }

    .room-tag {
      background: #ffe8a3;
      color: #6b4400;
      font-weight: 800;
      font-size: 13px;
      padding: 4px 10px;
      border-radius: 10px;
    }

    .sync-controls {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    .input-sm {
      border: 1px solid #c5d9ec;
      border-radius: 10px;
      padding: 7px 10px;
      font-size: 13px;
      font-weight: 600;
      background: #fff;
      color: var(--text-main);
    }

    .btn-sm {
      border: 1px solid #b8d2ea;
      background: #fff;
      color: var(--primary-dark);
      border-radius: 10px;
      padding: 7px 12px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-sm:hover {
      background: #eef6ff;
    }

    .sync-hint {
      font-size: 12px;
      color: #1565c0;
      background: #e3f2fd;
      padding: 7px 12px;
      border-radius: 10px;
      margin-bottom: 12px;
      line-height: 1.45;
    }

    .slot-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .slot-card {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 11px 14px;
      border-radius: 14px;
      border: 1px solid #e1ebf4;
      background: #ffffff;
    }

    .slot-card.me {
      border: 2px solid #ffb300;
      background: #fffdf5;
    }

    .slot-left {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
    }

    .tag-me {
      background: #ffa000;
      color: #fff;
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 8px;
    }

    .tag-peer {
      background: #1976d2;
      color: #fff;
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 8px;
    }

    .tag-ai {
      background: #78909c;
      color: #fff;
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 8px;
    }

    .slot-car {
      font-size: 13px;
      color: var(--text-sub);
      font-weight: 600;
    }

    .action-row {
      display: flex;
      gap: 12px;
      margin-top: 6px;
    }

    .btn-leave {
      flex: 0 0 110px;
      border: 1px solid #cfd8dc;
      background: #eceff1;
      color: #455a64;
      font-weight: 800;
      font-size: 15px;
      border-radius: 16px;
      padding: 14px;
      cursor: pointer;
    }

    .btn-start {
      flex: 1;
      border: none;
      background: linear-gradient(90deg, #ff9800 0%, #f57c00 100%);
      color: #ffffff;
      font-weight: 900;
      font-size: 17px;
      border-radius: 16px;
      padding: 14px 18px;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(245, 124, 0, 0.28);
    }

    .btn-start:hover {
      filter: brightness(1.03);
    }

    #raceView {
      display: none;
      flex-direction: column;
      gap: 12px;
    }

    .race-hud {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #102a43;
      color: #ffffff;
      padding: 12px 16px;
      border-radius: 14px;
      font-weight: 800;
      font-size: 14px;
      gap: 10px;
      flex-wrap: wrap;
    }

    canvas {
      width: 100%;
      height: 420px;
      border-radius: 16px;
      border: 2px solid #90caf9;
      background: #81d4fa;
      display: block;
    }

    .mobile-pad {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
    }

    .pad-btn {
      padding: 14px 10px;
      border-radius: 14px;
      border: 1px solid #bbdefb;
      background: #e3f2fd;
      color: #0d47a1;
      font-weight: 800;
      font-size: 15px;
      cursor: pointer;
    }

    .pad-btn:active {
      background: #90caf9;
    }

    .result-box {
      display: none;
      background: #fff8e1;
      border: 1px solid #ffd54f;
      border-radius: 16px;
      padding: 16px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <div class="header">
      <div class="badge-top">REALTIME MULTIPLAYER &amp; RANKING</div>
      <h1 class="title">🌴 코인 코스트 레이싱 🏎️</h1>
      <p class="subtitle">해안도로를 달리며 동전을 모으고 최고 기록에 도전하세요!</p>
    </div>

    <div id="lobbyView" class="content">
      <div class="hof-panel">
        <div>
          <div class="hof-title">🏆 역대 최고 점수 명예의 전당</div>
          <div id="hofSub" class="hof-sub">아직 등록된 최고 기록이 없습니다. 첫 번째 주인공이 되어보세요!</div>
        </div>
        <div id="myBestPill" class="my-best-pill">내 최고: 0원</div>
      </div>

      <div class="panel">
        <div class="lobby-top">
          <div class="lobby-status">
            <span class="dot"></span>
            <span id="roomCountText">실시간 대기실 (1/5명 접속)</span>
            <span id="roomBadge" class="room-tag">방 #7777</span>
          </div>

          <div class="sync-controls">
            <input id="nicknameInput" class="input-sm" type="text" maxlength="14" placeholder="닉네임" style="width: 110px;" />
            <input id="roomInput" class="input-sm" type="text" maxlength="10" value="7777" placeholder="방 번호" style="width: 82px;" />
            <button id="applyRoomBtn" class="btn-sm" type="button">방 입장/변경</button>
          </div>
        </div>

        <div id="syncStatusBox" class="sync-hint">
          동일 기기 탭 동기화(BroadcastChannel) 및 공개 실시간 중계 연결 대기 중 · 같은 방 번호(#7777)로 접속해 보세요.
        </div>

        <div id="slotList" class="slot-list"></div>
      </div>

      <div class="action-row">
        <button id="leaveBtn" class="btn-leave" type="button">나가기</button>
        <button id="startBtn" class="btn-start" type="button">START! 다같이 출발 🚀</button>
      </div>
    </div>

    <div id="raceView" class="content">
      <div class="race-hud">
        <span id="hudTime">⏱️ 남은 시간: 35초</span>
        <span id="hudScore">🪙 내 점수: 0원</span>
        <span id="hudRank">🏁 순위: 1위</span>
        <button id="backLobbyBtn" class="btn-sm" type="button">대기실로</button>
      </div>

      <canvas id="gameCanvas" width="730" height="420"></canvas>

      <div class="mobile-pad">
        <button id="leftBtn" class="pad-btn" type="button">⬅️ 왼쪽</button>
        <button id="boostBtn" class="pad-btn" type="button">⚡ 부스터</button>
        <button id="rightBtn" class="pad-btn" type="button">오른쪽 ➡️</button>
      </div>

      <div id="resultBox" class="result-box">
        <h3 id="resultTitle" style="margin: 0 0 6px;">레이스 종료!</h3>
        <p id="resultDetail" style="margin: 0 0 12px;"></p>
        <button id="replayBtn" class="btn-start" type="button" style="padding: 10px 18px; font-size: 15px;">다시 대기실로</button>
      </div>
    </div>
  </div>

  <script>
    const AI_NAMES = [
      { name: "AI_파도타기", car: "페라리 GT", color: "#ef5350" },
      { name: "AI_갈매기", car: "오프로드 SUV", color: "#26a69a" },
      { name: "AI_썬셋드라이버", car: "해변 오픈카", color: "#ab47bc" },
      { name: "AI_코코넛", car: "서핑 캠퍼밴", color: "#ffa726" }
    ];

    const CARS = ["F1 포뮬러", "페라리 GT", "오프로드 SUV", "해변 오픈카"];
    const PUBLIC_WS_ENDPOINTS = [
      "wss://ws.ifelse.io",
      "wss://socketsbay.com/wss/v2/1/demo/"
    ];

    const clientId = "p_" + Math.random().toString(36).slice(2, 9);
    let myNickname = localStorage.getItem("ccr_nick") || ("카레이서_" + Math.floor(10 + Math.random() * 89));
    let myCar = CARS[Math.floor(Math.random() * CARS.length)];
    let roomCode = (localStorage.getItem("ccr_room") || "7777").trim() || "7777";
    let bestScore = Number(localStorage.getItem("ccr_best") || "0") || 0;
    let hallOfFame = JSON.parse(localStorage.getItem("ccr_hof") || "null");

    // roomCode -> Map(clientId -> playerInfo)
    const remotePlayers = new Map();
    let wsSocket = null;
    let wsConnected = false;
    let channel = null;

    // Game state
    let gameRunning = false;
    let raceTimer = 35;
    let lastFrameTime = 0;
    let lastBroadcastTime = 0;
    let keys = { left: false, right: false, boost: false };

    let player = {
      x: 365,
      y: 345,
      vx: 0,
      score: 0,
      progress: 0,
      boost: 100
    };

    let coins = [];
    let aiRacers = [];

    const nicknameInput = document.getElementById("nicknameInput");
    const roomInput = document.getElementById("roomInput");
    const applyRoomBtn = document.getElementById("applyRoomBtn");
    const startBtn = document.getElementById("startBtn");
    const leaveBtn = document.getElementById("leaveBtn");
    const backLobbyBtn = document.getElementById("backLobbyBtn");
    const replayBtn = document.getElementById("replayBtn");
    const slotList = document.getElementById("slotList");
    const roomCountText = document.getElementById("roomCountText");
    const roomBadge = document.getElementById("roomBadge");
    const syncStatusBox = document.getElementById("syncStatusBox");
    const myBestPill = document.getElementById("myBestPill");
    const hofSub = document.getElementById("hofSub");

    const lobbyView = document.getElementById("lobbyView");
    const raceView = document.getElementById("raceView");
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    function initInputs() {
      nicknameInput.value = myNickname;
      roomInput.value = roomCode;
      updateHofUI();
    }

    function updateHofUI() {
      myBestPill.textContent = "내 최고: " + bestScore.toLocaleString() + "원";
      if (hallOfFame && hallOfFame.score > 0) {
        hofSub.textContent = "1위 " + hallOfFame.name + " · " + Number(hallOfFame.score).toLocaleString() + "원 (방 #" + hallOfFame.room + ")";
      } else {
        hofSub.textContent = "아직 등록된 최고 기록이 없습니다. 첫 번째 주인공이 되어보세요!";
      }
    }

    function saveScore(score) {
      if (score > bestScore) {
        bestScore = score;
        localStorage.setItem("ccr_best", String(bestScore));
      }
      if (!hallOfFame || score > hallOfFame.score) {
        hallOfFame = { name: myNickname, score: score, room: roomCode };
        localStorage.setItem("ccr_hof", JSON.stringify(hallOfFame));
      }
      updateHofUI();
    }

    function sendPacket(type, payload = {}) {
      const msg = {
        type,
        clientId,
        name: myNickname,
        car: myCar,
        room: roomCode,
        ts: Date.now(),
        ...payload
      };

      if (channel) {
        try {
          channel.postMessage(msg);
        } catch (_) {}
      }

      if (wsSocket && wsSocket.readyState === WebSocket.OPEN) {
        try {
          wsSocket.send(JSON.stringify(msg));
        } catch (_) {}
      }
    }

    function handleIncomingPacket(raw) {
      let data = raw;
      if (typeof raw === "string") {
        try {
          data = JSON.parse(raw);
        } catch (_) {
          return;
        }
      }
      if (!data || typeof data !== "object") return;
      if (!data.clientId || data.clientId === clientId) return;
      if (String(data.room || "") !== String(roomCode)) return;

      if (data.type === "LEAVE") {
        remotePlayers.delete(data.clientId);
        renderLobby();
        return;
      }

      remotePlayers.set(data.clientId, {
        clientId: data.clientId,
        name: data.name || "플레이어",
        car: data.car || "해변 오픈카",
        score: Number(data.score || 0),
        progress: Number(data.progress || 0),
        x: Number(data.x || 365),
        lastSeen: Date.now()
      });

      if (data.type === "START_RACE" && !gameRunning) {
        startRaceLocal(false);
      }

      renderLobby();
    }

    function setupBroadcastChannel() {
      if ("BroadcastChannel" in window) {
        if (channel) channel.close();
        channel = new BroadcastChannel("coin_coast_racing_" + roomCode);
        channel.onmessage = (ev) => handleIncomingPacket(ev.data);
      }
    }

    function connectPublicWebSocket() {
      if (wsSocket) {
        try { wsSocket.close(); } catch (_) {}
        wsSocket = null;
      }
      wsConnected = false;
      updateSyncStatus();

      let idx = 0;
      const tryNext = () => {
        if (idx >= PUBLIC_WS_ENDPOINTS.length) {
          wsConnected = false;
          updateSyncStatus();
          return;
        }
        const url = PUBLIC_WS_ENDPOINTS[idx++];
        try {
          const sock = new WebSocket(url);
          const timer = setTimeout(() => {
            if (sock.readyState !== WebSocket.OPEN) {
              try { sock.close(); } catch (_) {}
            }
          }, 3000);

          sock.onopen = () => {
            clearTimeout(timer);
            wsSocket = sock;
            wsConnected = true;
            updateSyncStatus();
            sendPacket("HELLO", { score: player.score, progress: player.progress, x: player.x });
          };

          sock.onmessage = (ev) => {
            handleIncomingPacket(ev.data);
          };

          sock.onerror = () => {
            clearTimeout(timer);
          };

          sock.onclose = () => {
            clearTimeout(timer);
            if (wsSocket === sock) {
              wsSocket = null;
              wsConnected = false;
              updateSyncStatus();
              setTimeout(tryNext, 2500);
            }
          };
        } catch (_) {
          tryNext();
        }
      };

      tryNext();
    }

    function updateSyncStatus() {
      const wsLabel = wsConnected
        ? "공개 실시간 중계 연결됨 (다른 기기 동기화 활성)"
        : "공개 중계 재연결 중 · 동일 탭 동기화 및 AI 매칭 동작 중";
      syncStatusBox.textContent = wsLabel + " · 현재 방 #" + roomCode + "에서 다른 기기도 같은 방 번호로 입장하세요.";
    }

    function pruneStalePeers() {
      const now = Date.now();
      let changed = false;
      for (const [id, info] of remotePlayers.entries()) {
        if (now - info.lastSeen > 12000) {
          remotePlayers.delete(id);
          changed = true;
        }
      }
      if (changed) renderLobby();
    }

    function renderLobby() {
      roomBadge.textContent = "방 #" + roomCode;
      const peers = Array.from(remotePlayers.values()).slice(0, 4);
      const humanCount = 1 + peers.length;
      roomCountText.textContent = "실시간 대기실 (" + humanCount + "/5명 접속)";

      slotList.innerHTML = "";

      // 1P (Me)
      const meEl = document.createElement("div");
      meEl.className = "slot-card me";
      meEl.innerHTML = `
        <div class="slot-left">
          <span class="tag-me">나 (1P)</span>
          <span>${escapeHtml(myNickname)}</span>
        </div>
        <div class="slot-car">${escapeHtml(myCar)}</div>
      `;
      slotList.appendChild(meEl);

      // Remote peers
      peers.forEach((p) => {
        const peerEl = document.createElement("div");
        peerEl.className = "slot-card";
        peerEl.innerHTML = `
          <div class="slot-left">
            <span class="tag-peer">동시접속</span>
            <span>${escapeHtml(p.name)}</span>
          </div>
          <div class="slot-car">${escapeHtml(p.car)} · ${p.score.toLocaleString()}원</div>
        `;
        slotList.appendChild(peerEl);
      });

      // Fill remaining up to 5 slots with AI
      const aiNeeded = Math.max(0, 5 - humanCount);
      for (let i = 0; i < aiNeeded; i++) {
        const ai = AI_NAMES[i % AI_NAMES.length];
        const aiEl = document.createElement("div");
        aiEl.className = "slot-card";
        aiEl.innerHTML = `
          <div class="slot-left">
            <span class="tag-ai">AI 로봇</span>
            <span>${escapeHtml(ai.name)}</span>
          </div>
          <div class="slot-car">${escapeHtml(ai.car)}</div>
        `;
        slotList.appendChild(aiEl);
      }
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function setupRaceEntities() {
      player = {
        x: canvas.width / 2,
        y: canvas.height - 65,
        vx: 0,
        score: 0,
        progress: 0,
        boost: 100
      };
      raceTimer = 35;

      coins = [];
      for (let i = 0; i < 14; i++) {
        coins.push(createCoin(true));
      }

      const humanCount = 1 + Math.min(4, remotePlayers.size);
      const aiCount = Math.max(0, 5 - humanCount);
      aiRacers = [];
      for (let i = 0; i < aiCount; i++) {
        const meta = AI_NAMES[i % AI_NAMES.length];
        aiRacers.push({
          name: meta.name,
          car: meta.car,
          color: meta.color,
          x: 170 + i * 95,
          y: 120 + (i % 2) * 55,
          score: 0,
          progress: 0,
          targetX: 220 + i * 70,
          dirTimer: 0.6 + i * 0.3
        });
      }

      document.getElementById("resultBox").style.display = "none";
    }

    function createCoin(randomY = false) {
      const roadLeft = 140;
      const roadRight = canvas.width - 140;
      const isGold = Math.random() < 0.25;
      return {
        x: roadLeft + Math.random() * (roadRight - roadLeft),
        y: randomY ? Math.random() * (canvas.height - 120) : -20,
        r: isGold ? 13 : 10,
        value: isGold ? 300 : 100,
        speed: isGold ? 190 : 150,
        gold: isGold
      };
    }

    function startRaceLocal(broadcastStart = true) {
      setupRaceEntities();
      gameRunning = true;
      lobbyView.style.display = "none";
      raceView.style.display = "flex";
      lastFrameTime = performance.now();
      if (broadcastStart) {
        sendPacket("START_RACE", { score: 0, progress: 0, x: player.x });
      }
      requestAnimationFrame(gameLoop);
    }

    function finishRace() {
      gameRunning = false;
      saveScore(player.score);
      sendPacket("FINISH_RACE", { score: player.score, progress: player.progress, x: player.x });

      const allScores = [
        { name: myNickname, score: player.score, isMe: true },
        ...Array.from(remotePlayers.values()).map((p) => ({ name: p.name, score: p.score, isMe: false })),
        ...aiRacers.map((a) => ({ name: a.name, score: a.score, isMe: false }))
      ].sort((a, b) => b.score - a.score);

      const rank = allScores.findIndex((item) => item.isMe) + 1;
      document.getElementById("resultTitle").textContent = "🏁 레이스 완주! (" + rank + "위)";
      document.getElementById("resultDetail").textContent =
        "획득 점수: " + player.score.toLocaleString() + "원 · 최고 기록: " + bestScore.toLocaleString() + "원";
      document.getElementById("resultBox").style.display = "block";
    }

    function gameLoop(now) {
      if (!gameRunning) return;
      const dt = Math.min(0.05, (now - lastFrameTime) / 1000);
      lastFrameTime = now;

      raceTimer -= dt;
      if (raceTimer <= 0) {
        raceTimer = 0;
        updateHud(1);
        renderRace();
        finishRace();
        return;
      }

      const boostActive = keys.boost && player.boost > 5;
      if (boostActive) {
        player.boost = Math.max(0, player.boost - 38 * dt);
      } else {
        player.boost = Math.min(100, player.boost + 20 * dt);
      }

      const moveSpeed = (boostActive ? 390 : 280);
      player.vx = 0;
      if (keys.left) player.vx -= moveSpeed;
      if (keys.right) player.vx += moveSpeed;

      player.x += player.vx * dt;
      const roadLeft = 135;
      const roadRight = canvas.width - 135;
      player.x = Math.max(roadLeft, Math.min(roadRight, player.x));
      player.progress += (boostActive ? 145 : 95) * dt;

      // Coins
      const speedMult = boostActive ? 1.45 : 1.0;
      for (let i = 0; i < coins.length; i++) {
        const c = coins[i];
        c.y += c.speed * speedMult * dt;

        const dx = c.x - player.x;
        const dy = c.y - player.y;
        if (Math.hypot(dx, dy) < c.r + 24) {
          player.score += c.value;
          coins[i] = createCoin(false);
          continue;
        }

        if (c.y > canvas.height + 25) {
          coins[i] = createCoin(false);
        }
      }

      // AI racers
      for (const ai of aiRacers) {
        ai.dirTimer -= dt;
        if (ai.dirTimer <= 0) {
          ai.dirTimer = 0.6 + Math.random() * 0.9;
          ai.targetX = roadLeft + 20 + Math.random() * (roadRight - roadLeft - 40);
        }
        const diff = ai.targetX - ai.x;
        ai.x += Math.sign(diff) * Math.min(Math.abs(diff), 165 * dt);
        ai.progress += (82 + Math.random() * 25) * dt;
        if (Math.random() < 0.03) ai.score += 100;
      }

      // Compute rank
      const standings = [
        { id: "me", score: player.score, progress: player.progress },
        ...Array.from(remotePlayers.values()).map((p) => ({ id: p.clientId, score: p.score, progress: p.progress })),
        ...aiRacers.map((a, idx) => ({ id: "ai_" + idx, score: a.score, progress: a.progress }))
      ].sort((a, b) => (b.score - a.score) || (b.progress - a.progress));

      const myRank = standings.findIndex((s) => s.id === "me") + 1;

      if (now - lastBroadcastTime > 180) {
        lastBroadcastTime = now;
        sendPacket("STATE", {
          score: player.score,
          progress: player.progress,
          x: player.x
        });
      }

      updateHud(myRank);
      renderRace();
      requestAnimationFrame(gameLoop);
    }

    function updateHud(rank) {
      document.getElementById("hudTime").textContent = "⏱️ 남은 시간: " + Math.ceil(raceTimer) + "초";
      document.getElementById("hudScore").textContent = "🪙 내 점수: " + player.score.toLocaleString() + "원";
      document.getElementById("hudRank").textContent = "🏁 순위: " + rank + "위";
    }

    function renderRace() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Sea & sand
      ctx.fillStyle = "#4fc3f7";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#ffe082";
      ctx.fillRect(0, 0, 115, canvas.height);
      ctx.fillRect(canvas.width - 115, 0, 115, canvas.height);

      // Road
      ctx.fillStyle = "#37474f";
      ctx.fillRect(115, 0, canvas.width - 230, canvas.height);

      // Road edges
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(122, 0, 6, canvas.height);
      ctx.fillRect(canvas.width - 128, 0, 6, canvas.height);

      // Animated center dashed line
      ctx.strokeStyle = "#ffd54f";
      ctx.lineWidth = 4;
      ctx.setLineDash([24, 24]);
      ctx.lineDashOffset = -(player.progress % 48);
      ctx.beginPath();
      ctx.moveTo(canvas.width / 2, 0);
      ctx.lineTo(canvas.width / 2, canvas.height);
      ctx.stroke();
      ctx.setLineDash([]);

      // Coins
      for (const c of coins) {
        ctx.beginPath();
        ctx.arc(c.x, c.y, c.r, 0, Math.PI * 2);
        ctx.fillStyle = c.gold ? "#ffca28" : "#ffb300";
        ctx.fill();
        ctx.lineWidth = 2;
        ctx.strokeStyle = "#fff8e1";
        ctx.stroke();
      }

      // AI cars
      for (const ai of aiRacers) {
        drawCar(ai.x, ai.y, ai.color, ai.name);
      }

      // Remote peer markers on top
      const peers = Array.from(remotePlayers.values());
      peers.forEach((p, i) => {
        const px = 160 + ((i * 130) % (canvas.width - 320));
        const py = 56 + (i % 2) * 26;
        drawCar(px, py, "#1e88e5", p.name + " (" + p.score + "원)");
      });

      // Player car
      drawCar(player.x, player.y, "#e53935", myNickname);
    }

    function drawCar(x, y, color, label) {
      ctx.save();
      ctx.translate(x, y);

      // Shadow
      ctx.fillStyle = "rgba(0,0,0,0.22)";
      ctx.beginPath();
      ctx.ellipse(0, 6, 22, 34, 0, 0, Math.PI * 2);
      ctx.fill();

      // Body
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.roundRect(-18, -30, 36, 60, 10);
      ctx.fill();

      // Windshield
      ctx.fillStyle = "#e1f5fe";
      ctx.fillRect(-12, -16, 24, 14);

      // Label
      ctx.fillStyle = "#ffffff";
      ctx.font = "bold 12px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(label, 0, -38);
      ctx.restore();
    }

    // Event listeners
    applyRoomBtn.addEventListener("click", () => {
      const nextNick = nicknameInput.value.trim();
      const nextRoom = roomInput.value.trim();
      if (nextNick) {
        myNickname = nextNick;
        localStorage.setItem("ccr_nick", myNickname);
      }
      if (nextRoom) {
        sendPacket("LEAVE");
        remotePlayers.clear();
        roomCode = nextRoom;
        localStorage.setItem("ccr_room", roomCode);
        setupBroadcastChannel();
        connectPublicWebSocket();
      }
      sendPacket("HELLO", { score: 0, progress: 0, x: player.x });
      renderLobby();
      updateSyncStatus();
    });

    startBtn.addEventListener("click", () => {
      startRaceLocal(true);
    });

    leaveBtn.addEventListener("click", () => {
      sendPacket("LEAVE");
      nicknameInput.value = myNickname;
      roomInput.focus();
      updateSyncStatus();
    });

    backLobbyBtn.addEventListener("click", () => {
      gameRunning = false;
      raceView.style.display = "none";
      lobbyView.style.display = "flex";
      sendPacket("HELLO", { score: player.score, progress: player.progress, x: player.x });
      renderLobby();
    });

    replayBtn.addEventListener("click", () => {
      gameRunning = false;
      raceView.style.display = "none";
      lobbyView.style.display = "flex";
      sendPacket("HELLO", { score: 0, progress: 0, x: player.x });
      renderLobby();
    });

    window.addEventListener("keydown", (e) => {
      if (e.key === "ArrowLeft" || e.key.toLowerCase() === "a") keys.left = true;
      if (e.key === "ArrowRight" || e.key.toLowerCase() === "d") keys.right = true;
      if (e.key === " " || e.key === "ArrowUp" || e.key.toLowerCase() === "w") keys.boost = true;
    });

    window.addEventListener("keyup", (e) => {
      if (e.key === "ArrowLeft" || e.key.toLowerCase() === "a") keys.left = false;
      if (e.key === "ArrowRight" || e.key.toLowerCase() === "d") keys.right = false;
      if (e.key === " " || e.key === "ArrowUp" || e.key.toLowerCase() === "w") keys.boost = false;
    });

    function bindTouchButton(id, keyName) {
      const el = document.getElementById(id);
      const down = (ev) => { ev.preventDefault(); keys[keyName] = true; };
      const up = (ev) => { ev.preventDefault(); keys[keyName] = false; };
      el.addEventListener("pointerdown", down);
      el.addEventListener("pointerup", up);
      el.addEventListener("pointerleave", up);
      el.addEventListener("pointercancel", up);
    }

    bindTouchButton("leftBtn", "left");
    bindTouchButton("rightBtn", "right");
    bindTouchButton("boostBtn", "boost");

    initInputs();
    setupBroadcastChannel();
    connectPublicWebSocket();
    renderLobby();
    updateSyncStatus();

    setInterval(() => {
      pruneStalePeers();
      if (!gameRunning) {
        sendPacket("PING", { score: player.score, progress: player.progress, x: player.x });
      }
    }, 3000);
  </script>
</body>
</html>
